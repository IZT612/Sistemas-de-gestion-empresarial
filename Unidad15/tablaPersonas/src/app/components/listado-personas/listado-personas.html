<div class="listado-container">

  <ul class="heroes">
    <li *ngFor="let persona of personas">
      <button type="button">
        <span class="badge">{{ persona.nombre }}</span>
        <span class="name">{{ persona.apellidos }} - {{ persona.genero }} - Edad: {{ persona.edad }}</span>
      </button>
    </li>
  </ul>

  <button routerLink="/">Volver a la tabla</button>

</div>
